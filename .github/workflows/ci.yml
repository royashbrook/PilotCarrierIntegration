name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - shell: pwsh
        run: |
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck
          # the manifest is the one list of pins: install exactly what it requires
          foreach ($r in (Import-PowerShellDataFile ./PilotCarrierIntegration/PilotCarrierIntegration.psd1).RequiredModules) { Install-Module $r.ModuleName -RequiredVersion $r.RequiredVersion -Scope CurrentUser -Force -AcceptLicense }
          Install-Module Add-PrefixForLogging, Clear-Files, SqlServer -Scope CurrentUser -Force -AcceptLicense
          Test-ModuleManifest ./PilotCarrierIntegration/PilotCarrierIntegration.psd1 | Out-Null
          Invoke-Pester ./tests -CI
