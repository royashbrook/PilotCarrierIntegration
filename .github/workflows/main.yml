name: PSGallery
on:
  release:
    types: [released]
jobs:
  psgallery_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publishing
        shell: pwsh
        run: |
          # the gallery checks RequiredModules against what is installed here
          Install-Module DataAgent -RequiredVersion 0.5.0 -Scope CurrentUser -Force
          Install-Module PilotCarrierClient -RequiredVersion 1.0.0 -Scope CurrentUser -Force
          Install-Module Add-PrefixForLogging -Scope CurrentUser -Force
          Publish-Module -Path 'PilotCarrierIntegration' -NuGetApiKey ${{ secrets.PS_GALLERY_KEY }}
