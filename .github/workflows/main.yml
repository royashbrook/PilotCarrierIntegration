name: PSGallery
on:
  release:
    types: [released]
jobs:
  psgallery_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publishing
        shell: pwsh
        run: |
          # the gallery checks RequiredModules against what is installed here
          # the manifest is the one list of pins: install exactly what it requires
          foreach ($r in (Import-PowerShellDataFile ./PilotCarrierIntegration/PilotCarrierIntegration.psd1).RequiredModules) { Install-Module $r.ModuleName -RequiredVersion $r.RequiredVersion -Scope CurrentUser -Force -AcceptLicense }
          Publish-Module -Path 'PilotCarrierIntegration' -NuGetApiKey ${{ secrets.PS_GALLERY_KEY }}
